pluginManagement {
    repositories {
        maven { url "https://maven.kikugie.dev/releases" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

rootProject.name = 'fishingfrenzy'

stonecutter {
    // Keep the existing Groovy build scripts; the version nodes use the dedicated matrix script.
    centralScript = 'build.matrix.gradle'
    kotlinController = false

    create(rootProject) {
        fileTree('gradle/matrix').matching { include '*.properties' }.files.sort().each { pinsFile ->
            def pins = new Properties()
            pinsFile.withInputStream { pins.load(it) }
            version(pinsFile.name - '.properties', pins.getProperty('minecraft_version'))
        }
    }
}

// Loom chooses its platform while each generated node applies its plugins.  Give
// NeoForge nodes that property before their central build script is evaluated;
// Fabric remains the default for the Fabric nodes.
gradle.beforeProject { project ->
    if (project.name.endsWith('-neoforge')) {
        project.extensions.extraProperties.set('loom.platform', 'neoforge')
    } else if (project.name.endsWith('-forge')) {
        project.extensions.extraProperties.set('loom.platform', 'forge')
    }
}
