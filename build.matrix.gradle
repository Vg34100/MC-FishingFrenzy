import java.util.Properties

plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    // 1.21 / Architectury 13 targets use the last contemporaneous Loom line.
    // A floating 1.6-SNAPSHOT currently resolves to a later transformer whose
    // NeoForge bootstrap does not complete for these legacy targets.
    id 'dev.architectury.loom' version '1.7.414' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT' apply false
}

def matrixPropertiesFile = rootProject.file("gradle/matrix/${project.name}.properties")
if (!matrixPropertiesFile.isFile()) {
    throw new GradleException("Missing matrix properties for ${project.path}: ${matrixPropertiesFile}")
}

def matrix = new Properties()
matrixPropertiesFile.withInputStream { matrix.load(it) }
def matrixValue = { String key ->
    def value = matrix.getProperty(key)
    if (value == null) {
        throw new GradleException("Missing '${key}' in ${matrixPropertiesFile}")
    }
    value
}

def loader = matrixValue('loader')
def javaVersion = matrix.getProperty('java_version', '25') as int
def usesLegacyLoom = matrix.getProperty('loom_generation', 'current') == 'legacy'
def isFabric = loader == 'fabric'
def isNeoForge = loader == 'neoforge'
if (!isFabric && !isNeoForge) {
    throw new GradleException("Unsupported matrix loader '${loader}' for ${project.path}")
}
group = rootProject.maven_group
version = rootProject.mod_version

apply plugin: usesLegacyLoom ? 'dev.architectury.loom' : 'dev.architectury.loom-no-remap'
if (!usesLegacyLoom) {
    apply plugin: 'architectury-plugin'
}

base {
    archivesName = "${rootProject.archives_name}-${loader}-${matrixValue('minecraft_version')}"
}

repositories {
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.neoforged.net/releases/' }
}

if (!usesLegacyLoom) {
    architectury {
        // Unlike the original subprojects, Stonecutter nodes do not inherit the
        // root Architectury configuration.  This must be set before selecting a
        // loader so Loom constructs the matching game/provider pipeline.
        minecraft = matrixValue('minecraft_version')
        platformSetupLoomIde()
        if (isFabric) {
            fabric()
        } else {
            neoForge()
        }
    }
}

if (usesLegacyLoom) {
    loom {
        silentMojangMappingsLicense()
    }

    tasks.register('verifyLegacyRuntime') {
        group = 'verification'
        description = 'Verifies that legacy game launch tasks use the Java 21 toolchain.'
        doLast {
            def runTasks = tasks.withType(JavaExec).findAll {
                it.name.equalsIgnoreCase('runClient') || it.name.equalsIgnoreCase('runServer')
            }
            if (runTasks.empty) {
                throw new GradleException("No JavaExec run tasks found for ${project.path}")
            }
            runTasks.each { runTask ->
                def launcher = runTask.javaLauncher.orNull
                logger.lifecycle("${runTask.path} uses ${launcher?.metadata?.installationPath}")
                if (launcher == null || launcher.metadata.languageVersion.asInt() != javaVersion) {
                    throw new GradleException("${runTask.path} is not configured for Java ${javaVersion}")
                }
            }
        }
    }
}

if (isNeoForge) {
    // Architectury's transform declaration is not itself Loom's platform switch.
    // Set the latter explicitly so the generated node receives NeoForge's patched
    // Minecraft runtime, FML launch arguments, and development configurations.
    loom {
        neoForge { }
    }
}

// Mirror the configuration shape Architectury's normal NeoForge module uses.  The
// version nodes are standalone projects, so they do not inherit this from the
// original loader subproject.
if (isNeoForge) {
    configurations {
        common {
            canBeResolved = true
            canBeConsumed = false
        }
        compileClasspath.extendsFrom common
        runtimeClasspath.extendsFrom common
        developmentNeoForge.extendsFrom common
    }
}

sourceSets {
    main {
        java {
            if (matrixValue('minecraft_version') == '26.2' || usesLegacyLoom) {
                setSrcDirs([
                        layout.buildDirectory.dir('matrix-sources/common').get().asFile,
                        layout.buildDirectory.dir("matrix-sources/${loader}").get().asFile
                ])
            } else {
                setSrcDirs([
                        rootProject.file('common/src/main/java'),
                        rootProject.file("${loader}/src/main/java")
                ])
            }
            if (usesLegacyLoom) {
                exclude 'net/vg/fishingfrenzy/fabric/data/**'
            }
        }
        resources {
            if (usesLegacyLoom) {
                setSrcDirs([
                        layout.buildDirectory.dir('matrix-resources/common').get().asFile,
                        layout.buildDirectory.dir("matrix-resources/${loader}").get().asFile
                ])
            } else {
                setSrcDirs([
                        rootProject.file('common/src/main/resources'),
                        rootProject.file("${loader}/src/main/resources")
                ])
            }
            if (isFabric) {
                srcDir rootProject.file('fabric/src/main/generated')
            }
        }
    }
}

// The 1.21 renderer and entity APIs predate the render-state model introduced
// later in the 26.x line. Generate a legacy view from the canonical sources so
// that the compatibility edits remain explicit and do not fork the main tree.
if (usesLegacyLoom) {
    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}LegacyResources", Sync) {
            from rootProject.file("${sourceName}/src/main/resources")
            into layout.buildDirectory.dir("matrix-resources/${sourceName}")
            filteringCharset = 'UTF-8'
            doLast {
                def resourceRoot = destinationDir

                // Item definition files were introduced after 1.21.  That version
                // still selects assets from models/item directly.
                project.delete(new File(resourceRoot, 'assets/fishingfrenzy/items'))

                if (sourceName == 'common') {
                    // 26.1 serializes ingredients as strings; 1.21 requires the
                    // older {item: ...}/{tag: ...} form.  Limit this to recipe
                    // ingredient fields so outputs and unrelated data remain exact.
                    def ingredientForLegacy = { value ->
                        value.startsWith('#') ? [tag: value.substring(1)] : [item: value]
                    }
                    fileTree(resourceRoot).matching {
                        include 'data/**/recipe/**/*.json'
                        include 'data/**/recipes/**/*.json'
                    }.files.each { recipeFile ->
                        def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
                        if (recipe instanceof Map) {
                            if (recipe.ingredient instanceof String) {
                                recipe.ingredient = ingredientForLegacy(recipe.ingredient)
                            }
                            if (recipe.ingredients instanceof List) {
                                recipe.ingredients = recipe.ingredients.collect { ingredient ->
                                    ingredient instanceof String ? ingredientForLegacy(ingredient) : ingredient
                                }
                            }
                            if (recipe.key instanceof Map) {
                                recipe.key.each { key, ingredient ->
                                    if (ingredient instanceof String) {
                                        recipe.key[key] = ingredientForLegacy(ingredient)
                                    }
                                }
                            }
                            recipeFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\\n', 'UTF-8')
                        }
                    }

                    // Location predicates used a singular biome field in 1.21.
                    fileTree(resourceRoot).matching { include 'data/**/loot_table/**/*.json' }.files.each { lootFile ->
                        lootFile.setText(lootFile.getText('UTF-8').replace('"biomes"', '"biome"'), 'UTF-8')
                    }

                    // Before item definitions, the fishing-rod cast state lived in
                    // the old model override system.
                    def rodModel = new File(resourceRoot, 'assets/fishingfrenzy/models/item/deluxe_fishing_rod.json')
                    if (rodModel.isFile()) {
                        def model = new groovy.json.JsonSlurper().parse(rodModel)
                        model.overrides = [[predicate: [cast: 1], model: 'fishingfrenzy:item/deluxe_fishing_rod_cast']]
                        rodModel.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model)) + '\\n', 'UTF-8')
                    }
                }

                if (sourceName == 'neoforge') {
                    // This compatibility mixin exists solely for the
                    // Architectury-20 / NeoForge-26.1 event rename.  Architectury
                    // 13 uses a different bridge, so declaring this required
                    // mixin against 1.21 would fail before Fishing Frenzy loads.
                    project.delete(new File(resourceRoot, 'fishingfrenzy-neoforge-compat.mixins.json'))
                    def modsToml = new File(resourceRoot, 'META-INF/neoforge.mods.toml')
                    if (modsToml.isFile()) {
                        modsToml.setText(
                                modsToml.getText('UTF-8')
                                        .replaceAll(/(?m)^\[\[mixins]]\Rconfig = "fishingfrenzy-neoforge-compat\.mixins\.json"\R?/, '')
                                        // iconFile replaced logoFile in NeoForge 26.2;
                                        // legacy FML still reads the older key.
                                        .replace('iconFile = "icon.png"', 'logoFile = "icon.png"'),
                                'UTF-8'
                        )
                    }
                }
            }
        }
    }

    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}LegacySources", Sync) {
            from rootProject.file("${sourceName}/src/main/java")
            into layout.buildDirectory.dir("matrix-sources/${sourceName}")
            filteringCharset = 'UTF-8'
            doLast {
                def legacyReplacements = [
                        'net.minecraft.resources.Identifier': 'net.minecraft.resources.ResourceLocation',
                        'Identifier.fromNamespaceAndPath': 'ResourceLocation.fromNamespaceAndPath',
                        'net.minecraft.advancements.criterion.MinMaxBounds': 'net.minecraft.advancements.critereon.MinMaxBounds',
                        'net.minecraft.world.entity.EntitySpawnReason': 'net.minecraft.world.entity.MobSpawnType',
                        'net.minecraft.world.entity.animal.fish.AbstractSchoolingFish': 'net.minecraft.world.entity.animal.AbstractSchoolingFish',
                        'net.minecraft.world.entity.animal.fish.WaterAnimal': 'net.minecraft.world.entity.animal.WaterAnimal',
                        'net.minecraft.world.level.gamerules.GameRules': 'net.minecraft.world.level.GameRules',
                        'Identifier': 'ResourceLocation',
                        'EntitySpawnReason': 'MobSpawnType',
                        'AbstractSchoolingFish': 'AbstractSchoolingFish'
                ]
                fileTree(destinationDir).matching { include '**/*.java' }.files.each { sourceFile ->
                    def source = sourceFile.getText('UTF-8')
                    legacyReplacements.each { from, to -> source = source.replace(from, to) }

                    if (sourceFile.name == 'FishingFrenzyNeoForgeClient.java') {
                        // NeoForge 1.21 requires client renderer events on the
                        // MOD bus; the current annotation no longer exposes
                        // that member and already selects the right bus.
                        source = source.replace(
                                '@EventBusSubscriber(modid = Constants.MOD_ID, value = Dist.CLIENT)',
                                '@EventBusSubscriber(modid = Constants.MOD_ID, value = Dist.CLIENT, bus = EventBusSubscriber.Bus.MOD)'
                        )
                        // Before 26.1 item tint data lived in the client item
                        // color registry.  The canonical items/ JSON tint data
                        // is deliberately removed for legacy resources, so
                        // register the equivalent colors on NeoForge's MOD bus.
                        source = source.replace(
                                'import net.neoforged.neoforge.client.event.EntityRenderersEvent;',
                                '''import net.neoforged.neoforge.client.event.EntityRenderersEvent;
import net.neoforged.neoforge.client.event.RegisterColorHandlersEvent;
import net.minecraft.world.item.Item;
import net.vg.fishingfrenzy.item.bait.targetbait.TargetBaitItem;
import net.vg.fishingfrenzy.item.fish.FishManager;'''
                        )
                        source = source.replace(
                                '\n}',
                                '''

    @SubscribeEvent
    public static void registerLegacyItemColors(RegisterColorHandlersEvent.Item event) {
        Item[] targetedBaits = FishManager.getItemsByType(FishManager.ItemType.BAIT).stream()
                .map(supplier -> supplier.get())
                .toArray(Item[]::new);
        event.register((stack, tintIndex) -> stack.getItem() instanceof TargetBaitItem bait
                ? 0xFF000000 | bait.getColor(tintIndex) : 0xFFFFFFFF, targetedBaits);

        Item[] spawnEggs = FishManager.getItemsByType(FishManager.ItemType.SPAWN_EGG).stream()
                .map(supplier -> supplier.get())
                .toArray(Item[]::new);
        // Fish-textured eggs must not inherit SpawnEggItem's egg-shell tint.
        event.register((stack, tintIndex) -> 0xFFFFFFFF, spawnEggs);
    }
}'''
                        )
                    }

                    if (sourceFile.name == 'FishingFrenzyFabricClient.java') {
                        // See the matching legacy NeoForge registration above.
                        // Fabric requires this at client initialization rather
                        // than through a MOD-bus event.
                        source = source.replace(
                                'import net.fabricmc.api.ClientModInitializer;',
                                '''import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.rendering.v1.ColorProviderRegistry;
import net.minecraft.world.item.Item;
import net.vg.fishingfrenzy.item.bait.targetbait.TargetBaitItem;
import net.vg.fishingfrenzy.item.fish.FishManager;'''
                        )
                        source = source.replace(
                                'ModClientEvents.registerClient();',
                                '''ModClientEvents.registerClient();
        registerLegacyItemColors();'''
                        )
                        source = source.replace(
                                '\n}',
                                '''

    private static void registerLegacyItemColors() {
        Item[] targetedBaits = FishManager.getItemsByType(FishManager.ItemType.BAIT).stream()
                .map(supplier -> supplier.get())
                .toArray(Item[]::new);
        ColorProviderRegistry.ITEM.register((stack, tintIndex) -> stack.getItem() instanceof TargetBaitItem bait
                ? 0xFF000000 | bait.getColor(tintIndex) : 0xFFFFFFFF, targetedBaits);

        Item[] spawnEggs = FishManager.getItemsByType(FishManager.ItemType.SPAWN_EGG).stream()
                .map(supplier -> supplier.get())
                .toArray(Item[]::new);
        ColorProviderRegistry.ITEM.register((stack, tintIndex) -> 0xFFFFFFFF, spawnEggs);
    }
}'''
                        )
                    }

                    if (sourceFile.path.replace('\\', '/').contains('/entity/client/') && source.contains('LivingEntityRenderState')) {
                        source = source.replace(
                                'import net.minecraft.client.model.EntityModel;',
                                'import net.minecraft.client.model.EntityModel;\nimport com.mojang.blaze3d.vertex.PoseStack;\nimport com.mojang.blaze3d.vertex.VertexConsumer;\nimport net.vg.fishingfrenzy.entity.mob.CustomBreedableSchoolingFishEntity;'
                        )
                        source = source.replaceAll(/import net\.minecraft\.client\.renderer\.entity\.state\.LivingEntityRenderState;\s*/, '')
                        source = source.replace('EntityModel<LivingEntityRenderState>', 'EntityModel<CustomBreedableSchoolingFishEntity>')
                        source = source.replaceAll(/\s*super\(root\.getChild\("[^"]+"\)\);/, '')
                        source = source.replace('private void applySwimmingAnimation(LivingEntityRenderState state)',
                                'private void applySwimmingAnimation(CustomBreedableSchoolingFishEntity entity, float ageInTicks)')
                        source = source.replace('state.ageInTicks', 'ageInTicks')
                        source = source.replace('state.isInWater', 'entity.isInWater()')
                        source = source.replace('public void setupAnim(LivingEntityRenderState state)',
                                'public void setupAnim(CustomBreedableSchoolingFishEntity entity, float limbSwing, float limbSwingAmount, float ageInTicks, float netHeadYaw, float headPitch)')
                        source = source.replace('this.setHeadAngles(state.yRot, state.xRot);', 'this.setHeadAngles(netHeadYaw, headPitch);')
                        source = source.replace('this.applySwimmingAnimation(state);', 'this.applySwimmingAnimation(entity, ageInTicks);')
                        def modelRootMatcher = source =~ /private final ModelPart (\w+);/
                        if (modelRootMatcher.find()) {
                            def modelRoot = modelRootMatcher.group(1)
                            source = source.replace('this.root().getAllParts().forEach(ModelPart::resetPose);',
                                    "this.${modelRoot}.getAllParts().forEach(ModelPart::resetPose);")
                            source = source.replaceFirst(/\n}\s*$/, """

    @Override
    public void renderToBuffer(PoseStack poseStack, VertexConsumer vertexConsumer, int packedLight, int packedOverlay, int color) {
        this.${modelRoot}.render(poseStack, vertexConsumer, packedLight, packedOverlay, color);
    }
}
""")
                        }
                    }

                    if (sourceFile.name == 'DynamicFishSystem.java') {
                        source = source.replaceAll(/import net\.minecraft\.client\.renderer\.entity\.state\.LivingEntityRenderState;\s*/, '')
                        source = source.replace('LivingEntityRenderState', 'CustomBreedableSchoolingFishEntity')
                        source = source.replace('EntityRenderer<CustomBreedableSchoolingFishEntity, ?>', 'EntityRenderer<CustomBreedableSchoolingFishEntity>')
                        source = source.replace('MobRenderer<CustomBreedableSchoolingFishEntity, CustomBreedableSchoolingFishEntity, EntityModel<CustomBreedableSchoolingFishEntity>>',
                                'MobRenderer<CustomBreedableSchoolingFishEntity, EntityModel<CustomBreedableSchoolingFishEntity>>')
                        source = source.replaceAll(/(?s)\n        @Override\n        public CustomBreedableSchoolingFishEntity createRenderState\(\) \{.*?\n        \}/, '')
                        source = source.replaceAll(/(?s)\n        @Override\n        public void extractRenderState\(CustomBreedableSchoolingFishEntity entity, CustomBreedableSchoolingFishEntity state, float partialTick\) \{.*?\n        \}/, '')
                        source = source.replace('getTextureLocation(CustomBreedableSchoolingFishEntity state)',
                                'getTextureLocation(CustomBreedableSchoolingFishEntity entity)')
                        source = source.replace('setupRotations(CustomBreedableSchoolingFishEntity state,',
                                'setupRotations(CustomBreedableSchoolingFishEntity entity,')
                        source = source.replace('state.isBaby', 'entity.isBaby()')
                        source = source.replace('state.isInWater', 'entity.isInWater()')
                    }

                    if (sourceFile.name == 'BreedableSchoolingFishEntity.java') {
                        source = source.replaceAll(/import net\.minecraft\.core\.UUIDUtil;\s*/, '')
                        source = source.replaceAll(/import net\.minecraft\.world\.level\.storage\.ValueInput;\s*/, '')
                        source = source.replaceAll(/import net\.minecraft\.world\.level\.storage\.ValueOutput;\s*/, '')
                        source = source.replace(
                                'public void addAdditionalSaveData(ValueOutput output)',
                                'public void addAdditionalSaveData(net.minecraft.nbt.CompoundTag tag)'
                        )
                        source = source.replace(
                                'super.addAdditionalSaveData(output);',
                                'super.addAdditionalSaveData(tag);'
                        )
                        source = source.replace('output.putInt(', 'tag.putInt(')
                        source = source.replace('output.storeNullable("LoveCause", UUIDUtil.STRING_CODEC, this.lovingPlayer);',
                                'if (this.lovingPlayer != null) tag.putUUID("LoveCause", this.lovingPlayer);')
                        source = source.replace(
                                'public void readAdditionalSaveData(ValueInput input)',
                                'public void readAdditionalSaveData(net.minecraft.nbt.CompoundTag tag)'
                        )
                        source = source.replace('super.readAdditionalSaveData(input);', 'super.readAdditionalSaveData(tag);')
                        source = source.replace('input.getIntOr("Age", 0)', 'tag.getInt("Age")')
                        source = source.replace('input.getIntOr("ForcedAge", 0)', 'tag.getInt("ForcedAge")')
                        source = source.replace('input.getIntOr("InLove", 0)', 'tag.getInt("InLove")')
                        source = source.replace('input.read("LoveCause", UUIDUtil.STRING_CODEC).orElse(null)',
                                'tag.hasUUID("LoveCause") ? tag.getUUID("LoveCause") : null')
                    }

                    if (sourceFile.name == 'FishRegistry.java') {
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.component\.Consumable;\s*/, '')
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.component\.TypedEntityData;\s*/, '')
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.consume_effects\.ApplyStatusEffectsConsumeEffect;\s*/, '')
                        source = source.replaceAll(/(?s)        Consumable\.Builder consumable = Consumable\.builder\(\);.*?        return builder\.build\(\);/, '''        if (snack) {
            builder.fast();
        }
        for (StatusEffectEntry entry : statusEffects) {
            builder.effect(new MobEffectInstance(entry.effect(), entry.duration(), entry.amplifier()), entry.chance());
        }
        return builder.build();''')
                        source = source.replaceAll(/(?s)new SpawnEggItem\(ModItems\.itemProperties\(name \+ "_spawn_egg"\)\s*\.component\(DataComponents\.ENTITY_DATA,\s*TypedEntityData\.of\(fishEntityType\.get\(\), new CompoundTag\(\)\)\)\)/,
                                'new SpawnEggItem(fishEntityType.get(), properties.getPrimaryColor(), properties.getSecondaryColor(), new Item.Properties())')
                    }

                    if (sourceFile.name == 'ModItems.java') {
                        source = source.replaceAll(/(?s)    public static Item\.Properties itemProperties\(String name\) \{.*?\n    \}/,
                                '    public static Item.Properties itemProperties(String name) {\n        return new Item.Properties();\n    }')
                    }

                    if (sourceFile.name == 'BaitItem.java') {
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.component\.TooltipDisplay;\s*/, '')
                        source = source.replaceAll(/import java\.util\.function\.Consumer;\s*/, '')
                        source = source.replace('TooltipDisplay display, Consumer<Component> addLine', 'List<Component> tooltip')
                        source = source.replace('super.appendHoverText(stack, context, display, addLine, tooltipFlag);',
                                'super.appendHoverText(stack, context, tooltip, tooltipFlag);')
                        source = source.replace('addLine.accept(', 'tooltip.add(')
                    }

                    if (sourceFile.name == 'DeluxeFishingRodItem.java') {
                        source = source.replace('import net.minecraft.world.InteractionResult;', 'import net.minecraft.world.InteractionResultHolder;')
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.ItemStackTemplate;\s*/, '')
                        source = source.replaceAll(/import net\.minecraft\.world\.item\.component\.TooltipDisplay;\s*/, '')
                        source = source.replaceAll(/import java\.util\.function\.Consumer;\s*/, '')
                        source = source.replace('public InteractionResult use(', 'public InteractionResultHolder<ItemStack> use(')
                        source = source.replace('rodStack.hurtAndBreak(i, pPlayer, pHand);', 'rodStack.hurtAndBreak(i, pPlayer, LivingEntity.getSlotForHand(pHand));')
                        source = source.replace('return InteractionResult.SUCCESS;', 'return InteractionResultHolder.sidedSuccess(rodStack, pLevel.isClientSide);')
                        source = source.replaceAll(/for \(ItemStackTemplate template : bundleContentsComponent\.items\(\)\) \{\s*if \(template\.item\(\)\.value\(\) instanceof BaitItem\) \{\s*return template\.create\(\);/,
                                'for (ItemStack itemStack : bundleContentsComponent.items()) {\n            if (itemStack.getItem() instanceof BaitItem) {\n                return itemStack.copy();')
                        source = source.replaceAll(/List<ItemStack> stacks = bundleContentsComponent\.itemCopyStream\(\)\.collect\(Collectors\.toList\(\)\);/,
                                'List<ItemStack> stacks = new ArrayList<>(bundleContentsComponent.items());')
                        source = source.replaceAll(/(?s)List<ItemStackTemplate> templates = stacks\.stream\(\)\s*\.map\(s -> new ItemStackTemplate\(s\.getItem\(\), s\.getCount\(\)\)\)\s*\.collect\(Collectors\.toList\(\)\);\s*rodStack\.set\(DataComponents\.BUNDLE_CONTENTS, new BundleContents\(templates\)\);/,
                                'rodStack.set(DataComponents.BUNDLE_CONTENTS, new BundleContents(stacks));')
                        source = source.replace('public boolean isBarVisible(ItemStack stack)', 'public boolean isBundleBarVisible(ItemStack stack)')
                        source = source.replace('public int getBarWidth(ItemStack stack)', 'public int getBundleBarWidth(ItemStack stack)')
                        source = source.replace('public int getBarColor(ItemStack stack)', 'public int getBundleBarColor()')
                        source = source.replaceAll(/@Override\s*\n        public boolean isBundleBarVisible/, 'public boolean isBundleBarVisible')
                        source = source.replaceAll(/@Override\s*\n        public int getBundleBarWidth/, 'public int getBundleBarWidth')
                        source = source.replaceAll(/@Override\s*\n        public int getBundleBarColor/, 'public int getBundleBarColor')
                        source = source.replaceAll(/@Override\s+public boolean isBundleBarVisible/, 'public boolean isBundleBarVisible')
                        source = source.replaceAll(/@Override\s+public int getBundleBarWidth/, 'public int getBundleBarWidth')
                        source = source.replaceAll(/@Override\s+public int getBundleBarColor/, 'public int getBundleBarColor')
                        source = source.replaceAll(/public void appendHoverText\(ItemStack stack, TooltipContext context, TooltipDisplay display, Consumer<Component> addLine, TooltipFlag tooltipFlag\) \{\s*BundleContents bundleContents = stack\.get\(DataComponents\.BUNDLE_CONTENTS\);\s*addLine\.accept\(Component\.translatable\("item\.fishingfrenzy\.deluxe_fishing_rod\.hint"\)\.withStyle\(ChatFormatting\.DARK_GRAY\)\);\s*if \(bundleContents != null\) \{\s*int used = bundleContents\.weight\(\)\.result\(\)\.map\(w -> Mth\.mulAndTruncate\(w, 64\)\)\.orElse\(0\);\s*addLine\.accept\(Component\.literal\("Bait: " \+ used \+ "\/64"\)\.withStyle\(ChatFormatting\.GRAY\)\);/,
                                'public void appendHoverText(ItemStack stack, TooltipContext context, List<Component> tooltip, TooltipFlag tooltipFlag) {\n        BundleContents bundleContents = stack.get(DataComponents.BUNDLE_CONTENTS);\n        tooltip.add(Component.translatable("item.fishingfrenzy.deluxe_fishing_rod.hint").withStyle(ChatFormatting.DARK_GRAY));\n        if (bundleContents != null) {\n            int used = Mth.mulAndTruncate(bundleContents.weight(), 64);\n            tooltip.add(Component.literal("Bait: " + used + "/64").withStyle(ChatFormatting.GRAY));')
                        source = source.replace('ItemUtils.onContainerDestroyed(itemEntity, bundleContents.itemCopyStream());',
                                'ItemUtils.onContainerDestroyed(itemEntity, bundleContents.itemsCopy());')
                        source = source.replace('new ArrayList<>(bundleContentsComponent.items())',
                                'new ArrayList<ItemStack>((List<ItemStack>) bundleContentsComponent.items())')
                        source = source.replace('bundleContents.weight().result().map(w -> w.compareTo(Fraction.ZERO) > 0).orElse(false)',
                                'bundleContents.weight().compareTo(Fraction.ZERO) > 0')
                        source = source.replace('bundleContents.weight().result().map(w -> Math.min(1 + Mth.mulAndTruncate(w, 12), 13)).orElse(0)',
                                'Math.min(1 + Mth.mulAndTruncate(bundleContents.weight(), 12), 13)')
                    }

                    if (sourceFile.name == 'TargetBaitItem.java') {
                        source = source.replace('nbt.getIntOr("PrimaryColor", 0xFFFFFF)',
                                'nbt.contains("PrimaryColor") ? nbt.getInt("PrimaryColor") : 0xFFFFFF')
                        source = source.replace('nbt.getIntOr("SecondaryColor", 0xFFFFFF)',
                                'nbt.contains("SecondaryColor") ? nbt.getInt("SecondaryColor") : 0xFFFFFF')
                    }

                    if (sourceFile.name == 'CustomBreedableSchoolingFishEntity.java') {
                        source = source.replace('protected void dropFromLootTable(ServerLevel serverLevel, DamageSource damageSource, boolean bl)',
                                'protected void dropFromLootTable(DamageSource damageSource, boolean bl)')
                        source = source.replace('super.dropFromLootTable(serverLevel, damageSource, bl);',
                                'super.dropFromLootTable(damageSource, bl);')
                        source = source.replace('this.spawnAtLocation(serverLevel, ', 'this.spawnAtLocation(')
                        source = source.replace('this.walkAnimation.update(f, 0.2f, 1.0f);', 'this.walkAnimation.update(f, 0.2f);')
                        source = source.replace('.create(level, MobSpawnType.BREEDING)', '.create(level)')
                        source = source.replace('.snapTo(', '.moveTo(')
                        source = source.replace('GameRules.MOB_DROPS', 'GameRules.RULE_DOMOBLOOT')
                        source = source.replace('level.getGameRules().get(GameRules.RULE_DOMOBLOOT)',
                                'level.getGameRules().getBoolean(GameRules.RULE_DOMOBLOOT)')
                    }

                    if (sourceFile.name == 'BreedableSchoolingFishEntity.java') {
                        source = source.replace('.snapTo(', '.moveTo(')
                        source = source.replace('GameRules.MOB_DROPS', 'GameRules.RULE_DOMOBLOOT')
                        source = source.replace('level.getGameRules().get(GameRules.RULE_DOMOBLOOT)',
                                'level.getGameRules().getBoolean(GameRules.RULE_DOMOBLOOT)')
                    }

                    if (sourceFile.name == 'FishingFrenzyDebugCommands.java') {
                        source = source.replace('Commands.hasPermission(Commands.LEVEL_GAMEMASTERS)', 'source -> source.hasPermission(2)')
                        source = source.replace('.create(level, MobSpawnType.NATURAL)', '.create(level)')
                    }

                    if (sourceFile.name == 'DeluxeFishingHook.java') {
                        source = source.replace('this.level().getServer().schedule(new TickTask(l * 5, () -> {',
                                'this.level().getServer().execute(() -> {')
                        source = source.replace('                        }));', '                        });')
                    }

                    if (sourceFile.name == 'FishPreset.java') {
                        source = source.replace('MobEffects.STRENGTH', 'MobEffects.DAMAGE_BOOST')
                        source = source.replace('MobEffects.HASTE', 'MobEffects.DIG_SPEED')
                        source = source.replace('MobEffects.SPEED', 'MobEffects.MOVEMENT_SPEED')
                        source = source.replace('MobEffects.JUMP_BOOST', 'MobEffects.JUMP')
                    }

                    if (sourceFile.name == 'DynamicFishEntityGenerator.java') {
                        source = source.replaceAll(/(?s)\.build\(\s*ResourceKey\.create\(\s*Registries\.ENTITY_TYPE,\s*ResourceLocation\.fromNamespaceAndPath\(Constants\.MOD_ID, entityName\)\s*\)\s*\)/,
                                '.build(entityName)')
                        source = source.replaceAll(/\.add\(Attributes\.ATTACK_DAMAGE, fishRegistry\.getAttackDamage\(\)\)\s*\.add\(Attributes\.TEMPT_RANGE, 10\.0\);/,
                                '.add(Attributes.ATTACK_DAMAGE, fishRegistry.getAttackDamage());')
                    }

                    if (sourceFile.name == 'DynamicFishSystem.java') {
                        source = source.replaceAll(/(?s)\s*@Override\s+public CustomBreedableSchoolingFishEntity createRenderState\(\) \{.*?\n\s*\}/, '')
                        source = source.replaceAll(/(?s)\s*@Override\s+public void extractRenderState\(CustomBreedableSchoolingFishEntity entity, CustomBreedableSchoolingFishEntity state, float partialTick\) \{.*?\n\s*\}/, '')
                        source = source.replace('protected void setupRotations(CustomBreedableSchoolingFishEntity entity, PoseStack poseStack, float ageInTicks, float rotationYaw)',
                                'protected void setupRotations(CustomBreedableSchoolingFishEntity entity, PoseStack poseStack, float ageInTicks, float rotationYaw, float partialTick, float scale)')
                        source = source.replace('super.setupRotations(state, poseStack, ageInTicks, rotationYaw);',
                                'super.setupRotations(entity, poseStack, ageInTicks, rotationYaw, partialTick, scale);')
                        source = source.replaceAll(/@Override\s+protected void setupRotations/, '@Override\n        protected void setupRotations')
                    }

                    if (sourceFile.name == 'ModItems.java') {
                        source = source.replace('.enchantable(1)', '')
                    }

                    if (sourceFile.name == 'ModEntitySpawns.java') {
                        source = source.replaceAll(/fishRegistry\.getFishEntityType\(\)\.get\(\),\s*fishRegistry\.getGroupSizes\(\)\.getFirst\(\),/,
                                'fishRegistry.getFishEntityType().get(),\n                                    fishRegistry.getSpawningWeight(),\n                                    fishRegistry.getGroupSizes().getFirst(),')
                        source = source.replace('biomeKey.identifier()', 'biomeKey.location()')
                        source = source.replaceAll(/\),\s*fishRegistry\.getSpawningWeight\(\)\s*\)/, '))')
                    }

                    if (sourceFile.name == 'FishingHookRendererMixin.java') {
                        // 26.1 renamed the renderer helper to getHoldingArm and
                        // changed its ItemStack access.  1.21 still determines
                        // the hand inside getPlayerHandPos via ItemStack#is.
                        source = '''package net.vg.fishingfrenzy.mixin;

import dev.architectury.registry.registries.RegistrySupplier;
import net.minecraft.client.renderer.entity.FishingHookRenderer;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.Items;
import net.vg.fishingfrenzy.registry.ModItems;
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.Unique;
import org.spongepowered.asm.mixin.injection.At;
import org.spongepowered.asm.mixin.injection.Redirect;

@Mixin(FishingHookRenderer.class)
public class FishingHookRendererMixin {
    @Redirect(
            method = "getPlayerHandPos",
            at = @At(value = "INVOKE", target = "Lnet/minecraft/world/item/ItemStack;is(Lnet/minecraft/world/item/Item;)Z")
    )
    private boolean fishingfrenzy$redirectFishingRodCheck(ItemStack stack, Item item) {
        return fishingfrenzy$isValidFishingRod(stack);
    }

    @Unique
    private static boolean fishingfrenzy$isValidFishingRod(ItemStack stack) {
        for (RegistrySupplier<Item> supplier : ModItems.FISHING_RODS) {
            if (stack.is(supplier.get())) {
                return true;
            }
        }
        return stack.is(Items.FISHING_ROD);
    }
}
'''
                    }

                    sourceFile.setText(source, 'UTF-8')
                }
            }
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareCommonLegacySources')
        dependsOn tasks.named("prepare${loader.capitalize()}LegacySources")
    }
    tasks.named('processResources') {
        dependsOn tasks.named('prepareCommonLegacyResources')
        dependsOn tasks.named("prepare${loader.capitalize()}LegacyResources")
    }
}

// 26.2 moved a small number of vanilla advancement classes. Keep the canonical
// source on the 26.1.2 names and generate the mechanically adjusted 26.2 view.
// This avoids duplicate source trees while making each matrix target explicit.
if (matrixValue('minecraft_version') == '26.2') {
    def advancementPackageReplacements = [
            'net.minecraft.advancements.criterion.MinMaxBounds': 'net.minecraft.advancements.predicates.MinMaxBounds',
            'net.minecraft.advancements.CriteriaTriggers': 'net.minecraft.advancements.triggers.CriteriaTriggers',
            'this.minecraft.setScreen(': 'this.minecraft.setScreenAndShow(',
            'valueLookupBuilder(': 'builder(',
            'ItemTags.FLOWERS': 'net.minecraft.tags.BlockItemTags.FLOWERS.item()',
            '.add(ModItems.DELUXE_FISHING_ROD.get())': '.add(BuiltInRegistries.ITEM.getResourceKey(ModItems.DELUXE_FISHING_ROD.get()).orElseThrow())',
            '.add(bait.get())': '.add(BuiltInRegistries.ITEM.getResourceKey(bait.get()).orElseThrow())',
            '.add(fish.get())': '.add(BuiltInRegistries.ITEM.getResourceKey(fish.get()).orElseThrow())',
            '.add(cookedfish.get())': '.add(BuiltInRegistries.ITEM.getResourceKey(cookedfish.get()).orElseThrow())'
    ]
    ['common', loader].each { sourceName ->
        tasks.register("prepare${sourceName.capitalize()}26_2Sources", Sync) {
            from rootProject.file("${sourceName}/src/main/java")
            into layout.buildDirectory.dir("matrix-sources/${sourceName}")
            filteringCharset = 'UTF-8'
            inputs.property('compatibilityReplacements', advancementPackageReplacements)
            filter { line ->
                advancementPackageReplacements.inject(line) { adjusted, from, to -> adjusted.replace(from, to) }
            }
        }
    }
    tasks.named('compileJava') {
        dependsOn tasks.named('prepareCommon26_2Sources')
        dependsOn tasks.named("prepare${loader.capitalize()}26_2Sources")
    }
}

dependencies {
    // Loom requires a declared Minecraft game dependency for every generated node. Its
    // NeoForge platform wiring replaces this with the matching merged runtime at launch.
    minecraft "net.minecraft:minecraft:${matrixValue('minecraft_version')}"
    if (usesLegacyLoom) {
        mappings loom.officialMojangMappings()
    }
    if (isFabric) {
        def fabricDependency = usesLegacyLoom ? { notation -> modImplementation notation } : { notation -> implementation notation }
        fabricDependency("net.fabricmc:fabric-loader:${matrixValue('fabric_loader_version')}")
        fabricDependency("net.fabricmc.fabric-api:fabric-api:${matrixValue('fabric_api_version')}")
        fabricDependency("dev.architectury:architectury-fabric:${matrixValue('architectury_api_version')}")
        fabricDependency("com.terraformersmc:modmenu:${matrixValue('modmenu_version')}")
        if (matrix.getProperty('mixinextras_version') != null) {
            implementation "io.github.llamalad7:mixinextras-fabric:${matrixValue('mixinextras_version')}"
        }
    } else {
        neoForge "net.neoforged:neoforge:${matrixValue('neoforge_version')}"
        implementation "dev.architectury:architectury-neoforge:${matrixValue('architectury_api_version')}"
        if (matrix.getProperty('mixinextras_version') != null) {
            implementation "io.github.llamalad7:mixinextras-neoforge:${matrixValue('mixinextras_version')}"
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
    if (usesLegacyLoom) {
        // Configure Java 21 at the project level before Loom creates and
        // finalizes its JavaExec tasks.  Do not set JavaExec#executable or
        // mutate a task's javaLauncher after evaluation: IntelliJ's Gradle
        // task model rightfully rejects either conflict.
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', matrixValue('minecraft_version')
    inputs.property 'architectury_api_version', matrixValue('architectury_api_version')
    inputs.property 'java_version', javaVersion
    if (isFabric) {
        filesMatching('fabric.mod.json') {
            expand version: project.version,
                    minecraft_version: matrixValue('minecraft_version'),
                    fabric_loader_version: matrixValue('fabric_loader_version'),
                    architectury_api_version: matrixValue('architectury_api_version'),
                    java_version: javaVersion
        }
    } else {
        inputs.property 'neoforge_version', matrixValue('neoforge_version')
        filesMatching('META-INF/neoforge.mods.toml') {
            expand version: project.version,
                    minecraft_version: matrixValue('minecraft_version'),
                    neoforge_version: matrixValue('neoforge_version'),
                    architectury_api_version: matrixValue('architectury_api_version')
        }
    }

    filesMatching('*.mixins.json') {
        expand java_version: javaVersion
    }
}

loom {
    runs {
        configureEach {
            runDir = rootProject.file("runs/${project.name}/${name}")
        }
    }
}

tasks.named('jar') {
    destinationDirectory = rootProject.layout.buildDirectory.dir("libs/${project.name}")
}
