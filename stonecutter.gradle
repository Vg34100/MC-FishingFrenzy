plugins {
    id 'dev.kikugie.stonecutter'
    id 'com.modrinth.minotaur' version '2.8.10' apply false
    id 'net.darkhax.curseforgegradle' version '1.3.33' apply false
}

// This is the version shown to the IDE. Matrix tasks compile every registered node.
stonecutter.active '26.1.2-fabric'

def matrixTargets = [
        '1.21-fabric', '1.21-neoforge',
        '1.21.1-fabric', '1.21.1-neoforge',
        '26.1-fabric', '26.1-neoforge',
        '26.1.1-fabric', '26.1.1-neoforge',
        '26.1.2-fabric', '26.1.2-neoforge',
        '26.2-fabric', '26.2-neoforge'
]

tasks.register('compileMatrix') {
    group = 'verification'
    description = 'Compiles every supported Minecraft-version and loader combination.'
    dependsOn matrixTargets.collect { ":${it}:compileJava" }
}

tasks.register('packageMatrix') {
    group = 'build'
    description = 'Processes resources and assembles installable jars for every matrix target.'
    dependsOn matrixTargets.collect { target ->
        // Legacy Loom's `jar` output is Mojang-named `-dev.jar`; only remapJar
        // can be installed in a real Fabric/NeoForge instance.
        (target.startsWith('1.21-') || target.startsWith('1.21.1-'))
                ? ":${target}:remapJar"
                : ":${target}:jar"
    }
}

tasks.register('verifyServerLaunchSetup') {
    group = 'verification'
    description = 'Generates dedicated-server launch configuration for every matrix target without starting Minecraft.'
    dependsOn matrixTargets.collect { ":${it}:configureLaunch" }
}

tasks.register('verifyMatrix') {
    group = 'verification'
    description = 'Runs compilation, packaging, and dedicated-server launch setup for the complete matrix.'
    dependsOn 'compileMatrix', 'packageMatrix', 'verifyServerLaunchSetup'
}

// Release-only framework wiring; the central matrix/source build remains authoritative.
subprojects {
    afterEvaluate {
        if (rootProject.file("gradle/matrix/${project.name}.properties").isFile()) {
            apply from: rootProject.file('gradle/release-smoke.gradle')
            if (providers.gradleProperty('publish_manifest').isPresent()) {
                apply plugin: 'com.modrinth.minotaur'
                apply plugin: 'net.darkhax.curseforgegradle'
                apply from: rootProject.file('gradle/publishing.gradle')
            }
        }
    }
}
